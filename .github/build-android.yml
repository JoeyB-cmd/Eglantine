# Builds an Android APK of Eglantine (Switch 2 emulator) for arm64 handhelds like the AYN Thor.
# Put this file in your GitHub fork of Djihads80/Eglantine at:  .github/workflows/build-android.yml
# Then: Actions tab -> "Build Android APK" -> Run workflow. The APK appears under the run's Artifacts.

name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "Release (fast) or RelWithDebInfo (better crash logs)"
        type: choice
        options: [Release, RelWithDebInfo]
        default: Release

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 340

    steps:
      - name: Free disk space (the native build is large)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/node_modules /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          df -h /

      - name: Check out Eglantine
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install the NDK and CMake versions the project pins
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          NDK=$(grep -oP 'ndkVersion = "\K[^"]+' src/android/app/build.gradle.kts)
          CMK=$(grep -oP 'version = "\K3\.[0-9.]+' src/android/app/build.gradle.kts | head -1)
          echo "NDK $NDK, CMake $CMK"
          yes | "$SDKM" --licenses > /dev/null
          "$SDKM" "ndk;$NDK" "cmake;$CMK"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/$NDK" >> "$GITHUB_ENV"

      - name: Give the app its own name and ID (installs next to Eden / Eden Duo)
        working-directory: src/android/app
        run: |
          sed -i 's/applicationId = "dev.eden.eden_emulator"/applicationId = "dev.eglantine.android"/' build.gradle.kts
          sed -i '/create("mainline")/,/}/ s/"appNameBase" to "Eden"/"appNameBase" to "Eglantine"/; /create("mainline")/,/}/ s/"app_name_suffixed", "Eden"/"app_name_suffixed", "Eglantine"/' build.gradle.kts
          sed -i 's/resValue("string", "app_name", "Eden$suffix")/resValue("string", "app_name", "Eglantine$suffix")/' build.gradle.kts
          grep -n 'applicationId = "dev.eglantine.android"' build.gradle.kts

      - name: Cache Gradle and CPM downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            .cache/cpm
          key: eglantine-android-${{ hashFiles('src/android/**/*.kts', 'cpmfile.json', '**/cpmfile.json') }}

      - name: Build APK
        working-directory: src/android
        run: |
          chmod +x gradlew
          if [ "${{ inputs.build_type }}" = "RelWithDebInfo" ]; then
            ./gradlew --no-daemon assembleMainlineRelWithDebInfo
          else
            ./gradlew --no-daemon assembleMainlineRelease
          fi

      - name: Collect APK
        run: |
          mkdir -p out
          find src/android/app/build/outputs/apk -name '*.apk' -exec cp {} out/ \;
          for f in out/*.apk; do mv "$f" "out/eglantine-android-arm64-$(git rev-parse --short HEAD).apk"; done
          ls -lh out

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: eglantine-android-arm64
          path: out/*.apk
          retention-days: 14
